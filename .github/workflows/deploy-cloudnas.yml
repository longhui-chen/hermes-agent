# Tar hermes source, push to every GCP VM tagged zettlab-role=cloudnas, and
# run the zettlab-cloudnas-deploy dispatcher: extract over the active
# zettlab-claw app source dir, sync dependencies, restart the shared Hermes
# gateway (`zettlab-claw.service`), then restart and health-check local-server.
# This requires the target VM's cloudnas dispatcher to support zettlab-claw
# shared gateway restarts.
#
# Triggers:
#   - workflow_dispatch only (manual). Pick ref / env / targets / dry_run.
#     Auto-deploy on push to main was intentionally removed — cloud NAS
#     deploys are manual-gated.
#
# Required GitHub Secrets:
#   GCP_SA_KEY              service-account JSON, with at minimum:
#                             roles/compute.osAdminLogin
#                             roles/iap.tunnelResourceAccessor
#                             roles/compute.viewer
#   FEISHU_DEPLOY_WEBHOOK_URL      (optional) Feishu webhook for the run summary
#
# Onboarding new hosts:
#   See zettlab-product-dev/scripts/cloudnas/onboard.sh. Once a VM has the
#   right labels, this workflow picks it up automatically.
#
# Note on OS Login profile size:
#   Each GH Actions runner generates a fresh SSH keypair and gcloud pushes it
#   into the SA's OS Login profile on first scp/ssh. Profile is hard-capped at
#   32 KiB; without housekeeping, ~50–60 stale keys later every deploy fails
#   with FAILED_PRECONDITION. Two-layer mitigation:
#     1. discover job purges all SA OS Login keys before fan-out (one-shot).
#     2. scp/ssh use --ssh-key-expire-after=10m so newly-pushed keys auto-GC.

name: Deploy to cloud NAS fleet

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to deploy (default: current branch)"
        required: false
        default: ""
      env:
        description: "Env filter (staging | all). prod is reserved; no real prod hosts exist yet."
        required: false
        default: "staging"
      targets:
        description: "Override: comma-separated instance names (empty = all matching env)"
        required: false
        default: ""
      dry_run:
        description: "Only list discovered targets, do not deploy"
        type: boolean
        default: false

env:
  GCP_PROJECT: zettlab-1

concurrency:
  group: deploy-cloudnas-fleet
  cancel-in-progress: false

jobs:
  discover:
    name: Discover targets
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
      count:  ${{ steps.list.outputs.count }}
    steps:
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.GCP_PROJECT }}

      - name: Purge OS Login SSH keys for deploy SA
        # Why REST instead of `gcloud compute os-login ssh-keys list/remove`:
        #   - the gcloud subcommand reported "No OS Login SSH keys present"
        #     while the REST API showed 50 keys filling 44 KiB → gcloud
        #     surfaces a stale or filtered view we can't trust.
        # Why DELETE on the email-based path (not the `name` field returned by
        # GET, which is keyed by SA UID `users/{numeric-uid}/sshPublicKeys/...`):
        #   - the OS Login API rejects a DELETE on the UID path with 403:
        #     "End user credentials must match the user specified in the
        #     request" — for an SA, the credential principal is the *email*,
        #     so the path component must be the email too.
        run: |
          set -euo pipefail
          TOKEN="$(gcloud auth print-access-token)"
          SA_EMAIL="$(gcloud auth list --filter='status:ACTIVE' --format='value(account)')"
          echo "SA: $SA_EMAIL"

          curl -fsS -H "Authorization: Bearer $TOKEN" \
            "https://oslogin.googleapis.com/v1/users/${SA_EMAIL}/loginProfile" \
            > profile.json
          echo "profile bytes: $(wc -c < profile.json)"
          echo "sshPublicKeys count: $(jq '.sshPublicKeys // {} | length' profile.json)"

          mapfile -t fps < <(jq -r '.sshPublicKeys // {} | keys[]' profile.json)
          if [ "${#fps[@]}" -eq 0 ]; then
            echo "Nothing to purge."
          else
            for fp in "${fps[@]}"; do
              [ -z "$fp" ] && continue
              status=$(curl -sS -o /dev/null -w '%{http_code}' -X DELETE \
                -H "Authorization: Bearer $TOKEN" \
                "https://oslogin.googleapis.com/v1/users/${SA_EMAIL}/sshPublicKeys/${fp}")
              if [ "$status" != "200" ]; then
                echo "DELETE ${fp:0:12}… status=$status"
              fi
            done
          fi

          curl -fsS -H "Authorization: Bearer $TOKEN" \
            "https://oslogin.googleapis.com/v1/users/${SA_EMAIL}/loginProfile" \
            > profile-after.json
          echo "post-purge bytes: $(wc -c < profile-after.json)"
          echo "post-purge sshPublicKeys: $(jq '.sshPublicKeys // {} | length' profile-after.json)"

      - name: Discover by GCP labels
        id: list
        env:
          # workflow_dispatch already defaults env to "staging"; keep the
          # fallback as a belt-and-suspenders guard against an empty input.
          ENV_INPUT: ${{ inputs.env || 'staging' }}
          NAMES_INPUT: ${{ inputs.targets }}
        run: |
          set -euo pipefail
          FILTER="labels.zettlab-role=cloudnas"
          if [ -n "$ENV_INPUT" ] && [ "$ENV_INPUT" != "all" ]; then
            FILTER+=" AND labels.zettlab-env=$ENV_INPUT"
          fi
          echo "filter: $FILTER"

          gcloud compute instances list \
            --project="${GCP_PROJECT}" \
            --filter="$FILTER" \
            --format="json" > all.json

          if [ -n "$NAMES_INPUT" ]; then
            jq --arg csv "$NAMES_INPUT" '
              ($csv | split(",") | map(gsub("^\\s+|\\s+$"; ""))) as $names
              | map(select(.name as $n | $names | index($n)))
            ' all.json > filtered.json
          else
            cp all.json filtered.json
          fi

          jq '{include: map({
            name: .name,
            zone: (.zone | split("/") | .[-1]),
            arch: (.labels["zettlab-arch"] // "amd64"),
            env:  (.labels["zettlab-env"]  // "unknown"),
            iap:  ((.labels["zettlab-iap"] // "true") != "false")
          })}' filtered.json > matrix.json

          echo "Discovered targets:"
          jq -r '.include[] | "  - \(.name)  zone=\(.zone)  arch=\(.arch)  env=\(.env)  iap=\(.iap)"' matrix.json
          COUNT=$(jq '.include | length' matrix.json)
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          # Use single-line `KEY=VALUE` form (jq -c emits one compact line);
          # multi-line heredoc to $GITHUB_OUTPUT triggers GitHub's secret
          # redaction heuristic and the matrix output gets dropped.
          echo "matrix=$(jq -c . matrix.json)" >> "$GITHUB_OUTPUT"

          if [ "$COUNT" -eq 0 ]; then
            echo "::warning::No matching cloud NAS hosts (filter: $FILTER)"
          fi

  deploy:
    name: Deploy → ${{ matrix.name }}
    needs: discover
    if: ${{ !inputs.dry_run && needs.discover.outputs.count != '0' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}
    concurrency:
      group: deploy-cloudnas-${{ matrix.name }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Archive hermes source (clean tree from git ref)
        run: |
          # `git archive` only emits tracked files for ${{ inputs.ref || github.sha }} —
          # gitignored files, .git/, build artifacts, and any working-tree
          # cruft are excluded by definition.
          git archive --format=tar.gz -o /tmp/hermes-src.tgz HEAD
          ls -lh /tmp/hermes-src.tgz

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.GCP_PROJECT }}

      - name: Resolve IAP flag
        id: iap
        run: |
          if [ "${{ matrix.iap }}" = "true" ]; then
            echo "flag=--tunnel-through-iap" >> "$GITHUB_OUTPUT"
          else
            echo "flag=" >> "$GITHUB_OUTPUT"
          fi

      # On a fresh runner the first scp/ssh transparently calls OS Login's
      # importSshPublicKey to register the runner's ephemeral key. When the
      # whole matrix fans out at once, those imports race and the API returns
      # "Multiple concurrent mutations were attempted. Please retry the
      # request." gcloud does not retry on its own, so wrap each call with a
      # backoff loop that retries only on that exact conflict.
      - name: SCP tarball to ${{ matrix.name }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            err=$(mktemp)
            if gcloud compute scp \
                --project="${{ env.GCP_PROJECT }}" \
                --zone="${{ matrix.zone }}" \
                ${{ steps.iap.outputs.flag }} \
                --ssh-key-expire-after=10m \
                --quiet \
                /tmp/hermes-src.tgz \
                "${{ matrix.name }}:/tmp/hermes-src.tgz" 2> >(tee "$err" >&2); then
              exit 0
            fi
            if ! grep -q "Multiple concurrent mutations" "$err"; then
              exit 1
            fi
            sleep_s=$((attempt * 3 + RANDOM % 4))
            echo "concurrent-mutation race on attempt $attempt; sleeping ${sleep_s}s"
            sleep "$sleep_s"
          done
          echo "scp gave up after 5 attempts" >&2
          exit 1

      - name: Run dispatcher
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            err=$(mktemp)
            if gcloud compute ssh \
                --project="${{ env.GCP_PROJECT }}" \
                --zone="${{ matrix.zone }}" \
                ${{ steps.iap.outputs.flag }} \
                --ssh-key-expire-after=10m \
                --quiet \
                "${{ matrix.name }}" \
                --command="sudo /usr/local/bin/zettlab-cloudnas-deploy hermes /tmp/hermes-src.tgz" 2> >(tee "$err" >&2); then
              exit 0
            fi
            if ! grep -q "Multiple concurrent mutations" "$err"; then
              exit 1
            fi
            sleep_s=$((attempt * 3 + RANDOM % 4))
            echo "concurrent-mutation race on attempt $attempt; sleeping ${sleep_s}s"
            sleep "$sleep_s"
          done
          echo "dispatcher ssh gave up after 5 attempts" >&2
          exit 1

      - name: Write version
        run: |
          set -euo pipefail
          payload=$(printf 'git_sha=%s\ndeployed_at=%s\nworkflow_run=%s\n' \
            "${{ github.sha }}" \
            "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}")
          for attempt in 1 2 3 4 5; do
            err=$(mktemp)
            if echo "$payload" | gcloud compute ssh \
                --project="${{ env.GCP_PROJECT }}" \
                --zone="${{ matrix.zone }}" \
                ${{ steps.iap.outputs.flag }} \
                --ssh-key-expire-after=10m \
                --quiet \
                "${{ matrix.name }}" \
                --command="sudo /usr/local/bin/zettlab-cloudnas-deploy write-version hermes" 2> >(tee "$err" >&2); then
              exit 0
            fi
            if ! grep -q "Multiple concurrent mutations" "$err"; then
              exit 1
            fi
            sleep_s=$((attempt * 3 + RANDOM % 4))
            echo "concurrent-mutation race on attempt $attempt; sleeping ${sleep_s}s"
            sleep "$sleep_s"
          done
          echo "write-version ssh gave up after 5 attempts" >&2
          exit 1

      - name: Show post-deploy status
        if: always()
        run: |
          gcloud compute ssh \
            --project="${{ env.GCP_PROJECT }}" \
            --zone="${{ matrix.zone }}" \
            ${{ steps.iap.outputs.flag }} \
            --ssh-key-expire-after=10m \
            --quiet \
            "${{ matrix.name }}" \
            --command="sudo /usr/local/bin/zettlab-cloudnas-deploy status" || true

  notify:
    name: Notify Feishu
    needs: [discover, deploy]
    if: always()
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/github-script@v8
        env:
          FEISHU_DEPLOY_WEBHOOK_URL: ${{ secrets.FEISHU_DEPLOY_WEBHOOK_URL }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          DISCOVER_RESULT: ${{ needs.discover.result }}
          TARGET_COUNT: ${{ needs.discover.outputs.count }}
          DRY_RUN: ${{ inputs.dry_run }}
          ENV_FILTER: ${{ inputs.env }}
          TARGETS_OVERRIDE: ${{ inputs.targets }}
        with:
          script: |
            if (!process.env.FEISHU_DEPLOY_WEBHOOK_URL) {
              core.warning('FEISHU_DEPLOY_WEBHOOK_URL not set; skipping');
              return;
            }
            const dryRun = process.env.DRY_RUN === 'true';
            const status = dryRun
              ? `dry-run (count=${process.env.TARGET_COUNT})`
              : (process.env.DEPLOY_RESULT === 'skipped'
                  ? `discover-only: ${process.env.DISCOVER_RESULT}`
                  : process.env.DEPLOY_RESULT);
            const repo = `${context.repo.owner}/${context.repo.repo}`;
            const sha  = context.sha.substring(0, 7);
            const branch = context.ref.replace('refs/heads/', '');
            const runUrl = `${context.serverUrl}/${repo}/actions/runs/${context.runId}`;
            const commitUrl = `${context.serverUrl}/${repo}/commit/${context.sha}`;
            const title = `[${context.repo.repo}] cloud NAS deploy ${status}`;
            const content = [
              [{ tag: 'text', text: `Status: ${status}` }],
              [{ tag: 'text', text: `Targets: ${process.env.TARGET_COUNT} (env=${process.env.ENV_FILTER}, override=${process.env.TARGETS_OVERRIDE || '(none)'})` }],
              [{ tag: 'text', text: `Branch: ${branch}` }],
              [
                { tag: 'text', text: 'Commit: ' },
                { tag: 'a', text: sha, href: commitUrl },
              ],
              [{ tag: 'text', text: `Actor: ${context.actor}` }],
              [{ tag: 'a', text: 'View workflow run', href: runUrl }],
            ];
            await fetch(process.env.FEISHU_DEPLOY_WEBHOOK_URL, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                msg_type: 'post',
                content: { post: { zh_cn: { title, content } } },
              }),
            });
