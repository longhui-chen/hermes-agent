name: Open PR on upstream release

on:
  schedule:
    - cron: '30 18 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  open-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          # GITHUB_TOKEN (not the RELEASE_PR_TOKEN PAT) so that subsequent
          # git pushes can update workflow files under .github/workflows/
          # without tripping the "PAT lacks `workflow` scope" rejection.
          # PR creation below still uses RELEASE_PR_TOKEN so that the
          # opened PR triggers downstream CI workflows.
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/NousResearch/hermes-agent.git || true

      - name: Get latest upstream release tag
        id: rel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=$(gh api repos/NousResearch/hermes-agent/releases/latest --jq .tag_name)
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "branch=sync/upstream-${TAG}" >> "$GITHUB_OUTPUT"

      - name: Fetch tag and resolve release commit
        id: sha
        run: |
          git fetch upstream "refs/tags/${{ steps.rel.outputs.tag }}:refs/tags/${{ steps.rel.outputs.tag }}"
          SHA=$(git rev-parse "refs/tags/${{ steps.rel.outputs.tag }}^{commit}")
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Update origin/upstream pointer to latest release commit
        run: |
          SHA="${{ steps.sha.outputs.sha }}"
          CURRENT=$(git ls-remote origin refs/heads/upstream | awk '{print $1}')
          if [ "$CURRENT" = "$SHA" ]; then
            echo "origin/upstream already at $SHA; no-op"
          else
            echo "Updating origin/upstream: ${CURRENT:-<absent>} -> $SHA"
            git push --force origin "${SHA}:refs/heads/upstream"
          fi

      - name: Ensure sync branch exists (frozen at release tag)
        run: |
          BRANCH="${{ steps.rel.outputs.branch }}"
          SHA="${{ steps.sha.outputs.sha }}"
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "Branch $BRANCH already exists; leaving as-is (may contain manual conflict resolutions)."
          else
            echo "Creating branch $BRANCH at release commit $SHA"
            git push origin "${SHA}:refs/heads/${BRANCH}"
          fi

      - name: Compute commits ahead of main
        id: diff
        run: |
          git fetch origin "${{ steps.rel.outputs.branch }}:${{ steps.rel.outputs.branch }}"
          BEHIND=$(git rev-list --count "main..${{ steps.rel.outputs.branch }}")
          echo "behind=$BEHIND" >> "$GITHUB_OUTPUT"

      - name: Open or update sync PR
        if: steps.diff.outputs.behind != '0'
        uses: repo-sync/pull-request@v2
        with:
          source_branch: ${{ steps.rel.outputs.branch }}
          destination_branch: main
          pr_title: "chore(sync): merge upstream ${{ steps.rel.outputs.tag }}"
          pr_label: "upstream-sync"
          pr_body: |
            Automated PR from upstream sync.

            - Upstream release: `${{ steps.rel.outputs.tag }}`
            - Source branch (frozen at release commit): `${{ steps.rel.outputs.branch }}`
            - Release commit SHA: `${{ steps.sha.outputs.sha }}`
            - Commits ahead of main: ${{ steps.diff.outputs.behind }}

            ## Branch maintenance

            This workflow also force-updates `origin/upstream` to the latest release commit on each run (idempotent — skipped if already there). `origin/upstream` is therefore a stable pointer to the latest upstream release between runs.

            The PR head `${{ steps.rel.outputs.branch }}` is created once from the release commit and is **not** moved by automation, so manual conflict-resolution commits pushed to it will persist.

            ## Conflict resolution

            If conflicts arise, commit fixes directly to `${{ steps.rel.outputs.branch }}`.

            ## Review checklist before merging

            - [ ] `hermes_cli/main.py` — `OFFICIAL_REPO_URLS` / `OFFICIAL_REPO_URL` still point to `zettlab/hermes-agent`
            - [ ] `scripts/install.sh` — `REPO_URL_SSH` / `REPO_URL_HTTPS` still point to `zettlab/hermes-agent`
            - [ ] `.github/workflows/` — only zettlab workflows present (no upstream tests/nix/docker/site reintroduced)
            - [ ] Tests still pass on a deploy target
          github_token: ${{ secrets.RELEASE_PR_TOKEN }}
