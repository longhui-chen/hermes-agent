name: Open PR on upstream release

on:
  schedule:
    - cron: '30 18 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  open-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PR_TOKEN }}

      - name: Get latest upstream release tag
        id: rel
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PR_TOKEN }}
        run: |
          TAG=$(gh api repos/NousResearch/hermes-agent/releases/latest --jq .tag_name)
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Compare main vs upstream
        id: diff
        run: |
          git fetch origin upstream:upstream
          BEHIND=$(git rev-list --count main..upstream)
          echo "behind=$BEHIND" >> "$GITHUB_OUTPUT"

      - name: Open or update sync PR
        if: steps.diff.outputs.behind != '0'
        uses: repo-sync/pull-request@v2
        with:
          source_branch: upstream
          destination_branch: main
          pr_title: "chore(sync): merge upstream ${{ steps.rel.outputs.tag }}"
          pr_label: "upstream-sync"
          pr_body: |
            Automated PR from upstream sync.

            - Latest upstream release: `${{ steps.rel.outputs.tag }}`
            - Commits behind upstream: ${{ steps.diff.outputs.behind }}

            ## Review checklist before merging
            - [ ] `hermes_cli/main.py` — `OFFICIAL_REPO_URLS` / `OFFICIAL_REPO_URL` still point to `zettlab/hermes-agent`
            - [ ] `scripts/install.sh` — `REPO_URL_SSH` / `REPO_URL_HTTPS` still point to `zettlab/hermes-agent`
            - [ ] `.github/workflows/` — only zettlab workflows present (no upstream tests/nix/docker/site reintroduced)
            - [ ] Tests still pass on a deploy target
          github_token: ${{ secrets.RELEASE_PR_TOKEN }}
