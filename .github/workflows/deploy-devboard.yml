# Sync hermes source to every board listed in .github/devboard-fleet.json,
# run uv sync via dispatcher, restart local-server (which the registry uses
# to spawn per-agent gateway children — there is no global hermes daemon),
# write .version.
#
# Per-board secrets live in GitHub Environments, one env per board:
#   devboard-<board-name> with secrets HOST / PORT / USER / DEPLOY_KEY.
# Same env names + same key as the zettlab-local-server workflow.
#
# Adding board-N:
#   1. append { "name": "board-N" } to .github/devboard-fleet.json
#   2. create environment `devboard-board-N` and add the four secrets above
#   No edits to this workflow needed.
#
# Trigger semantics:
#   - push to main (excluding doc / website / nix / tests / unrelated workflows)
#     → fan out to every board in inventory
#   - workflow_dispatch → optional targets CSV filter + dry_run
#
# Notes:
#   - Boards must be provisioned first (scripts/provisioning/ in the
#     zettlab-product-dev monorepo): /usr/local/bin/zettlab-deploy dispatcher
#     + a working venv at /opt/zettlab/hermes/venv (one-off `uv venv` +
#     `uv sync` from the board).
#   - The deploy key's public half must be in each board's authorized_keys
#     with command="/usr/local/bin/zettlab-deploy".
#   - rsync goes through the dispatcher's `rsync --server` whitelist; the
#     destination must stay under /opt/zettlab/.
#   - `--no-owner --no-group` keeps the board's root:root ownership intact;
#     the dispatcher also `chown -R root:root` defensively.

name: Deploy to devboard

on:
  push:
    branches: [main]
    # Use paths-ignore (blacklist) rather than paths (whitelist): hermes
    # source layout shifts with every upstream sync, so a whitelist would
    # silently rot. Listing the directories that DON'T affect on-board
    # behavior is more durable.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'website/**'
      - 'nix/**'
      - 'tests/**'
      - '.github/workflows/deploy-cloudnas.yml'
      - '.github/workflows/upstream-release-pr.yml'
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to deploy (default: current branch)"
        required: false
        default: ""
      targets:
        description: "CSV of board names, or 'all' (default 'all')"
        required: false
        default: "all"
      dry_run:
        description: "Only list discovered targets, do not deploy"
        type: boolean
        default: false

jobs:
  discover:
    name: Discover targets
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
      count:  ${{ steps.list.outputs.count }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}

      - id: list
        env:
          TARGETS: ${{ inputs.targets || 'all' }}
        run: |
          set -euo pipefail
          jq -c --arg t "$TARGETS" '
            .boards
            | if ($t == "" or $t == "all") then .
              else map(select(.name as $n
                              | ($t | split(",") | map(gsub("^\\s+|\\s+$"; "")))
                              | index($n)))
              end
            | { include: . }
          ' .github/devboard-fleet.json > matrix.json

          echo "Discovered targets:"
          jq -r '.include[] | "  - \(.name)"' matrix.json
          COUNT=$(jq '.include | length' matrix.json)
          echo "count=$COUNT"     >> "$GITHUB_OUTPUT"
          echo "matrix=$(cat matrix.json)" >> "$GITHUB_OUTPUT"
          if [ "$COUNT" -eq 0 ]; then
            echo "::warning::no boards matched targets='$TARGETS'"
          fi

  deploy:
    name: Deploy → ${{ matrix.name }}
    needs: discover
    if: ${{ !inputs.dry_run && needs.discover.outputs.count != '0' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    environment: devboard-${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}
    concurrency:
      group: deploy-devboard-hermes-${{ matrix.name }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Load deploy key into ssh-agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_KEY }}

      - name: Add board host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p ${{ secrets.PORT }} ${{ secrets.HOST }} >> ~/.ssh/known_hosts

      - name: Rsync source tree
        run: |
          rsync -avz --delete \
            --no-owner --no-group \
            -e "ssh -p ${{ secrets.PORT }}" \
            --exclude=venv/ \
            --exclude=__pycache__/ \
            --exclude=.git/ \
            --exclude=.env \
            --exclude=hermes-data/ \
            --exclude=.pytest_cache/ \
            --exclude=node_modules/ \
            ./ \
            ${{ secrets.USER }}@${{ secrets.HOST }}:/opt/zettlab/hermes/

      - name: Trigger deploy on board (uv sync + restart local-server)
        run: |
          ssh -p ${{ secrets.PORT }} \
            ${{ secrets.USER }}@${{ secrets.HOST }} \
            hermes-deploy

      - name: Write version file
        run: |
          {
            echo "git_sha=${{ github.sha }}"
            echo "deployed_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "workflow_run=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "target=${{ matrix.name }}"
          } | ssh -p ${{ secrets.PORT }} \
              ${{ secrets.USER }}@${{ secrets.HOST }} \
              "write-version hermes"

      - name: Show post-deploy status
        if: always()
        run: |
          ssh -p ${{ secrets.PORT }} \
            ${{ secrets.USER }}@${{ secrets.HOST }} \
            status || true

  notify:
    name: Notify Feishu
    needs: [discover, deploy]
    if: always()
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/github-script@v8
        env:
          FEISHU_DEPLOY_WEBHOOK_URL: ${{ secrets.FEISHU_DEPLOY_WEBHOOK_URL }}
          DISCOVER_RESULT: ${{ needs.discover.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          TARGET_COUNT: ${{ needs.discover.outputs.count }}
          DRY_RUN: ${{ inputs.dry_run }}
          TARGETS: ${{ inputs.targets || 'all' }}
        with:
          script: |
            if (!process.env.FEISHU_DEPLOY_WEBHOOK_URL) {
              core.warning('FEISHU_DEPLOY_WEBHOOK_URL not set; skipping deploy notification');
              return;
            }
            const dryRun = process.env.DRY_RUN === 'true';
            const status = dryRun
              ? `dry-run (count=${process.env.TARGET_COUNT})`
              : (process.env.DEPLOY_RESULT === 'skipped'
                  ? `discover-only: ${process.env.DISCOVER_RESULT}`
                  : process.env.DEPLOY_RESULT);
            const repo = `${context.repo.owner}/${context.repo.repo}`;
            const sha = context.sha.substring(0, 7);
            const branch = context.ref.replace('refs/heads/', '');
            const runUrl = `${context.serverUrl}/${repo}/actions/runs/${context.runId}`;
            const commitUrl = `${context.serverUrl}/${repo}/commit/${context.sha}`;
            const title = `[${context.repo.repo}] Devboard deploy ${status}`;
            const content = [
              [{ tag: 'text', text: `Status: ${status}` }],
              [{ tag: 'text', text: `Targets: ${process.env.TARGETS} (count=${process.env.TARGET_COUNT})` }],
              [{ tag: 'text', text: `Branch: ${branch}` }],
              [
                { tag: 'text', text: 'Commit: ' },
                { tag: 'a', text: sha, href: commitUrl },
              ],
              [{ tag: 'text', text: `Actor: ${context.actor}` }],
              [{ tag: 'a', text: 'View workflow run', href: runUrl }],
            ];
            await fetch(process.env.FEISHU_DEPLOY_WEBHOOK_URL, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                msg_type: 'post',
                content: { post: { zh_cn: { title, content } } },
              }),
            });
