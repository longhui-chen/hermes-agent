name: Notify Architecture Vault

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: architecture-vault-dispatch-${{ github.repository }}
  cancel-in-progress: true

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Create an Obsidian-repository token
        id: architecture-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.ARCHITECTURE_VAULT_DISPATCH_APP_CLIENT_ID }}
          private-key: ${{ secrets.ARCHITECTURE_VAULT_DISPATCH_APP_PRIVATE_KEY }}
          owner: zettlab
          repositories: zettlab-obsidian
          permission-contents: write

      - name: Notify the Obsidian workflow
        env:
          GH_TOKEN: ${{ steps.architecture-token.outputs.token }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          gh api \
            --method POST \
            repos/zettlab/zettlab-obsidian/dispatches \
            --field event_type=architecture-source-updated \
            --field "client_payload[repository]=${SOURCE_REPOSITORY}" \
            --field "client_payload[sha]=${SOURCE_SHA}"
