name: home-guard-tests

# Runtime HOME guard (ZET-1938) regression gate. This branch converges the
# subprocess-HOME contract onto the MCP / LSP / codex-app-server / Copilot-ACP
# spawn paths and hardens the shared marker logic in hermes_constants.py. Those
# ~1600 lines of tests were previously run only by hand — no CI job exercised
# them (seed-policy-check.yml runs a different, fixed file set). This job closes
# that gap.
#
# Mirrors the mature pytest pattern from seed-policy-check.yml (the repo's one
# working CI pytest job): pytest-timeout is mandatory because pyproject's addopts
# sets --timeout/--timeout-method and pytest exits 4 (usage error) without it;
# setuptools is needed for a few import-time deps. httpx / mcp / starlette are
# added because two of the home-guard test modules import runtime-provider and
# the MCP tool, which pull those in during collection (verified in a clean venv).

on:
  pull_request:
    paths:
      # Source: the subprocess-HOME contract + every spawn path it feeds.
      - 'hermes_constants.py'
      - 'tools/mcp_tool.py'
      - 'tools/code_execution_tool.py'
      - 'tools/environments/local.py'
      - 'agent/lsp/client.py'
      - 'agent/transports/codex_app_server.py'
      - 'agent/copilot_acp_client.py'
      # Tests: the home-guard suites this job runs.
      - 'tests/test_subprocess_home_isolation.py'
      - 'tests/test_hermes_constants.py'
      - 'tests/tools/test_mcp_tool.py'
      - 'tests/tools/test_code_execution_windows_env.py'
      - 'tests/agent/lsp/**'
      - 'tests/agent/transports/test_codex_app_server_runtime.py'
      - 'tests/agent/test_copilot_acp_client.py'
      # This workflow itself.
      - '.github/workflows/home-guard-tests.yml'
  workflow_dispatch:

jobs:
  home-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.11'
      - name: Home-guard subprocess-HOME contract tests
        run: |
          # pytest-timeout is required: pyproject addopts sets --timeout/
          # --timeout-method, and pytest exits 4 (usage error) without it.
          # setuptools covers a few import-time deps.
          # httpx / mcp / starlette: two of the modules below import
          # hermes_cli.runtime_provider (pulls httpx) and tools.mcp_tool's
          # MCP-SDK symbols (pulls mcp + starlette) at collection time — pins
          # match pyproject ([mcp] extra + core httpx).
          python -m pip install --quiet \
            pyyaml==6.0.3 pytest==9.0.2 pytest-timeout==2.4.0 setuptools==82.0.1 \
            "httpx[socks]==0.28.1" mcp==1.26.0 starlette==1.0.1
          # Only tests/agent/lsp/test_client_home_contract.py from the LSP dir:
          # the rest of that dir uses pytest-asyncio and spawns a real mock LSP
          # server (unrelated to the HOME guard, extra deps). Windows-only cases
          # in test_code_execution_windows_env.py auto-skip on ubuntu.
          # tests/test_docker_webui_install_surface.py is deliberately excluded
          # (its imports need packages unrelated to this branch).
          python -m pytest -q \
            tests/test_subprocess_home_isolation.py \
            tests/test_hermes_constants.py \
            tests/tools/test_mcp_tool.py \
            tests/tools/test_code_execution_windows_env.py \
            tests/agent/lsp/test_client_home_contract.py \
            tests/agent/transports/test_codex_app_server_runtime.py \
            tests/agent/test_copilot_acp_client.py
