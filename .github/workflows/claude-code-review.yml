name: Claude Code Review (self-hosted)

# 自托管评审引擎 —— 当仓库**没有**接入 Claude 托管 Code Review（Team/Enterprise 后台开通）时的替代路径。
# 在 PR → main 时用 anthropics/claude-code-action@v1 + code-review 插件
# 跑 /code-review，把发现的问题作为 PR 行内评论贴出，并产出机器可读 codereview-result.json；
# 随后复用 scripts/codereview（真源）把不通过结论发进飞书评审群、@ PR 作者。
#
# 与托管路径二选一：同一仓库不要同时开两条评审引擎（会重复评审/重复通知）。
# 鉴权用订阅 OAuth token（secret CLAUDE_CODE_OAUTH_TOKEN，由 `claude setup-token` 生成）或 ANTHROPIC_API_KEY，
# 任意付费档可用，不依赖 Team/Enterprise 后台。飞书通知用 CODEREVIEW_FEISHU_{APP_ID,APP_SECRET,CHAT_ID}（已设）。
#
# 安全：用 pull_request（非 pull_request_target）—— fork PR 拿不到 secret（评审/通知自动跳过），
# 只有本组织成员的同仓 PR 才带 secret 跑。评审只读 + 只写 PR 评论，不改代码（本 workflow 不做自动修复）。
# 需要自动修复：用本地 `/code-review ultra --fix`，或另建受控修复流程（改动只进修复分支 + 开 PR、
# 绝不直推 main，遵守 HR：state mutation 可回滚 + 人工复核）。

on:
  pull_request:
    branches: [main]            # 只评审目标分支是 main 的 PR
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: claude-code-review-${{ github.repository }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true       # 同 PR 新 push 取消上一轮评审，省钱

permissions:
  contents: read
  pull-requests: write           # 贴行内评审评论
  issues: write                  # PR 评论 / 话题锚点
  checks: read
  id-token: write                # claude-code-action 需要（OIDC）

jobs:
  review:
    if: >-
      github.repository_owner == 'zettlab' &&
      github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30          # opus 评审较慢，给足时间避免被掐断
    steps:
      - name: Checkout PR (full context)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0         # 给评审完整 git 上下文（diff main...PR）

      - name: Run Claude /code-review
        id: review
        uses: anthropics/claude-code-action@v1
        with:
          # 用订阅 OAuth token（claude setup-token 生成）——无需单独 API key/账单。
          # 也可换成 anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # 显式喂 workflow 自带 GITHUB_TOKEN，绕开 OIDC 换 Claude App token（你组织没装 Claude App）
          github_token: ${{ github.token }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          # 用插件 skill 跑评审；并要求额外吐一个机器可读结论文件给飞书通知步骤消费。
          prompt: |
            REPO: ${{ github.repository }}
            PR: ${{ github.event.pull_request.number }}

            任务：
            1) 运行 /code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }}
               评审本 PR（main...PR 的 diff），把发现的问题作为 PR 行内评论贴出。
            2) 评审标准：以仓库根 REVIEW.md 为最高优先级，叠加 CLAUDE.md / AGENTS.md 的 Engineering Hard Rules
               （内存预算 2GB、HA & 自愈、Agent 安全、API 向后兼容、配置唯一生效位置）。
               只把「合并前应修的真 bug / 安全 / 契约破坏」标为 Important，风格类最多 Nit。
            3) 评审结束后，用文件写工具把机器可读结论写到 ./codereview-result.json，schema：
               {"verdict":"pass"|"fail","important":<int>,"nit":<int>,"pre_existing":<int>,
                "issues":[{"severity":"important"|"nit"|"pre_existing","file":"<path>","line":<int>,"title":"<one line>"}]}
               有任一 important 则 verdict=fail，否则 pass。这个文件只给内部通知用，不要贴到 PR。
          # 用 opus-4-8（评审质量最强；~10-15min/PR，异步不挡合并）。
          # max-turns 给足：/code-review 插件固定开销就要 ~15+ 轮，砍太低会 error_max_turns 直接失败
          claude_args: |
            --max-turns 50
            --model claude-opus-4-8
            --allowedTools "Read,Grep,Glob,Bash(git diff:*),Bash(git log:*),Write"

      - name: Upload review result artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codereview-result
          path: codereview-result.json
          if-no-files-found: ignore

      # 在 PR 上贴一条顶层评论，明确标注「本评审由 Claude /code-review ultra 完成」+ 结论
      - name: Post /code-review ultra attribution comment
        if: always()
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            let r = null;
            try { r = JSON.parse(fs.readFileSync(`${process.env.GITHUB_WORKSPACE}/codereview-result.json`, 'utf8')); }
            catch (e) { core.info('无评审结论文件（评审可能未完成），跳过归属评论'); return; }
            const imp = Number(r.important || 0), nit = Number(r.nit || 0);
            const fail = r.verdict === 'fail' || imp > 0;
            const verdict = fail
              ? `🔴 发现 ${imp} 个需合并前修复的问题${nit ? `（另 ${nit} 个 nit）` : ''}，详见行内评论。`
              : `✅ 未发现需合并前修复的问题${nit ? `（${nit} 个 nit 见行内评论）` : ''}。`;
            // 问题清单：与飞书卡片同源（codereview-result.json 的 issues 数组），让 GitHub 这条评论也能一眼看全。
            const ICON = { important: '🔴', nit: '🟡', pre_existing: '🟣' };
            const RANK = { important: 0, nit: 1, pre_existing: 2 };
            const issues = (Array.isArray(r.issues) ? r.issues : [])
              .slice().sort((a, b) => (RANK[a && a.severity] ?? 9) - (RANK[b && b.severity] ?? 9));
            const lines = [
              '🤖 本 PR 已由 Claude **`/code-review ultra`** 自动评审。',
              '',
              verdict,
            ];
            if (issues.length) {
              lines.push('', '<details open><summary><b>问题清单</b></summary>', '');
              issues.slice(0, 20).forEach((it, i) => {
                const loc = [it && it.file, it && it.line].filter(x => x != null && x !== '').join(':');
                const t = (it && it.title) ? String(it.title).replace(/\r?\n/g, ' ').trim() : '';
                lines.push(`${i + 1}. ${ICON[it && it.severity] || '•'} ${loc ? `\`${loc}\`` : ''}${t ? ` — ${t}` : ''}`);
              });
              if (issues.length > 20) lines.push('', `…另有 ${issues.length - 20} 项，详见行内评论。`);
              lines.push('', '</details>');
            }
            lines.push('', '<sub>引擎：anthropics/claude-code-action · 评审口径见仓库 REVIEW.md · 不通过结论同步至飞书 zettlab-ai-codereview 并 @ 作者</sub>');
            const body = lines.join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.payload.pull_request.number, body,
            });
            core.info('已贴 /code-review ultra 归属评论');

      # 复用真源做飞书通知（本仓自带 scripts/codereview；其它仓由 rollout 一并下发或改用托管路径）
      - name: Notify Feishu on failure
        if: always()
        uses: actions/github-script@v8
        env:
          CODEREVIEW_FEISHU_APP_ID: ${{ secrets.CODEREVIEW_FEISHU_APP_ID }}
          CODEREVIEW_FEISHU_APP_SECRET: ${{ secrets.CODEREVIEW_FEISHU_APP_SECRET }}
          CODEREVIEW_FEISHU_CHAT_ID: ${{ secrets.CODEREVIEW_FEISHU_CHAT_ID }}
          CODEREVIEW_NOTIFY_ON: important
        with:
          script: |
            const fs = require('fs');
            const path = `${process.env.GITHUB_WORKSPACE}/codereview-result.json`;
            let result = null;
            try { result = JSON.parse(fs.readFileSync(path, 'utf8')); }
            catch (e) { core.info('未产出 codereview-result.json（评审可能未完成/被跳过），不通知: ' + e.message); return; }
            const { notifyFromActionResult } = require(`${process.env.GITHUB_WORKSPACE}/scripts/codereview/notify.js`);
            await notifyFromActionResult({ github, context, core, result });
