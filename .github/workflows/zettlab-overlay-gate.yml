name: Zettlab Overlay Gate

# HR8 (zettlab-product-dev 总方案 §1.3 / 附录 H): the upstream Hermes core is a
# stable kernel. A PR that adds lines to run_agent.py, agent/**, tools/**,
# gateway/run.py, gateway/platforms/base.py or gateway/platforms/api_server.py
# must (1) mark every added hunk with
#   `# zettlab-overlay(<batch>): <one line>; upstream: <PR url | #n | none>`,
# (2) stay within the added-lines budget (scripts/test-harness/overlay_gate.json,
#     or declare `overlay-budget-exception: <reason>` in the PR body),
# (3) carry an `upstream-pr:` line in the PR body, and
# (4) never add Zettlab business state fields to the kernel.
# Upstream sync branches (sync/upstream-*) are skipped by the script itself.

on:
  pull_request:  # no paths filter: GitHub only evaluates the first 300 changed files, so a large PR could hide kernel edits; the script fast-passes when no kernel file is touched
  workflow_dispatch:

permissions:
  contents: read

jobs:
  overlay-gate:
    if: github.repository_owner == 'zettlab'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Materialize trusted gate from base ref
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags --quiet origin "refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
          mkdir -p "$RUNNER_TEMP/gate/scripts/test-harness" "$RUNNER_TEMP/gate/tests/ci"
          for f in scripts/test-harness/overlay_gate.py scripts/test-harness/overlay_gate.json tests/ci/test_overlay_gate.py; do
            if git cat-file -e "origin/${BASE_REF}:$f" 2>/dev/null; then
              git show "origin/${BASE_REF}:$f" > "$RUNNER_TEMP/gate/$f"
            else
              echo "::warning::$f is absent on base ${BASE_REF}; bootstrapping the gate from the PR head (first introduction only)"
              cp "$f" "$RUNNER_TEMP/gate/$f"
            fi
          done
      - name: Gate self-test (trusted copy)
        if: github.event_name == 'pull_request'
        run: |
          python -m pip install --quiet --disable-pip-version-check pytest==9.1.1
          python -m pytest -q -p no:cacheprovider "$RUNNER_TEMP/gate/tests/ci/test_overlay_gate.py"
      - name: Overlay gate (HR8, trusted copy against PR head)
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          printf '%s' "$PR_BODY" > "$RUNNER_TEMP/pr_body.txt"
          python "$RUNNER_TEMP/gate/scripts/test-harness/overlay_gate.py" \
            --repo "$GITHUB_WORKSPACE" \
            --config "$RUNNER_TEMP/gate/scripts/test-harness/overlay_gate.json" \
            --base "origin/${BASE_REF}" --head HEAD \
            --pr-body-file "$RUNNER_TEMP/pr_body.txt" --head-ref "$HEAD_REF"
      - name: Self-test on manual run
        if: github.event_name == 'workflow_dispatch'
        run: |
          python -m pip install --quiet --disable-pip-version-check pytest==9.1.1
          python -m pytest -q -p no:cacheprovider tests/ci/test_overlay_gate.py
