name: Zettlab Overlay Gate

# HR8 (zettlab-product-dev 总方案 §1.3 / 附录 H): the upstream Hermes core is a
# stable kernel. A PR that adds lines to run_agent.py, hermes_state.py, agent/**,
# tools/**, gateway/run.py, gateway/platforms/base.py or
# gateway/platforms/api_server.py must (1) mark every added hunk with
#   `# zettlab-overlay(<batch>): <one line>; upstream: <PR url | #n | none>`,
# (2) stay within the added-lines budget (scripts/test-harness/overlay_gate.json,
#     or declare `overlay-budget-exception: <reason>` in the PR body),
# (3) carry an `upstream-pr:` line in the PR body,
# (4) never add Zettlab business state fields to the kernel, and
# (5) use LF only. Upstream sync PRs are skipped only when the sync/upstream-* branch
#     name, the `upstream-sync` label (write access) and a same-repo head all agree.
#
# Trust model: the `overlay-gate` job runs on `pull_request_target`, so the workflow
# definition, the script, its config and its self-test all come from the BASE branch;
# the PR head is only fetched as data for `git diff` / `git show` and is never checked
# out or executed. Mark `overlay-gate` as a required status check in branch protection.
# `edited` re-runs the PR-body checks (upstream-pr); `labeled` / `unlabeled` re-run the
# sync-branch exemption after upstream-release-pr.yml adds the `upstream-sync` label.
# This file deliberately has NO other trigger and NO other job: a same-named job that
# gets skipped on another event would count as a successful `overlay-gate` context and
# satisfy branch protection. The PR-side self-test lives in
# zettlab-overlay-gate-selftest.yml under a different job name.

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]

permissions:
  contents: read

jobs:
  overlay-gate:
    if: github.repository_owner == 'zettlab'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Default checkout on pull_request_target = the BASE branch (trusted). Do not
      # check out the PR head here; it is fetched as a ref below and never executed.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Gate self-test (base copy)
        run: |
          python -m pip install --quiet --disable-pip-version-check pytest==9.1.1
          python -m pytest -q -p no:cacheprovider tests/ci/test_overlay_gate.py
      - name: Fetch PR head as diff input
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch --no-tags --quiet origin "+refs/pull/${PR_NUMBER}/head:refs/remotes/pr/head"
          test "$(git rev-parse refs/remotes/pr/head)" = "$HEAD_SHA" || { echo "PR head ref/sha mismatch"; exit 2; }
          # main 回灌集成分支时，上游整段增量相对集成分支成了无标记新增。
          # 取一份可信的 origin/main 供 --upstream-ref 逐字比对（remote ref，非 PR 输入）。
          git fetch --no-tags --quiet origin "+refs/heads/main:refs/remotes/origin/main"
      - name: Overlay gate (HR8)
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.event.pull_request.base.repo.full_name }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          printf '%s' "$PR_BODY" > "$RUNNER_TEMP/pr_body.txt"
          python scripts/test-harness/overlay_gate.py \
            --repo "$GITHUB_WORKSPACE" \
            --base "origin/${BASE_REF}" --head refs/remotes/pr/head \
            --pr-body-file "$RUNNER_TEMP/pr_body.txt" --head-ref "$HEAD_REF" \
            --pr-labels "$PR_LABELS" --head-repo "$HEAD_REPO" --base-repo "$BASE_REPO" \
            --upstream-ref refs/remotes/origin/main
