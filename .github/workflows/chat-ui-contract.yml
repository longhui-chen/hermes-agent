name: chat-ui-contract

# Zettlab chat-ui contract v1 (zettlab-product-dev contracts/chat-ui/v1).
# This repo produces the `event: hermes.tool.progress` extension frames; the
# contract doc (docs/zet-agent-sse-extension-contract.md) and the golden set
# must list every payload.type literal in gateway/platforms/zet_agent.py.
#
# Two jobs on purpose: `tests` runs the adapter's turn_id / schema-mirror
# pytest on PRs without any secret; `contract` needs a cross-repo PAT and
# therefore only runs trusted default-branch code (push to main, nightly,
# manual) — a PR tree must never see the PAT.

on:
  pull_request:
    paths:
      - 'gateway/platforms/zet_agent.py'
      - 'gateway/platforms/api_server.py'
      - 'docs/zet-agent-sse-extension-contract.md'
      - 'schemas/chatproto.schema.json'
      - 'tests/gateway/test_zet_agent_extension_turn_id.py'
      - 'tests/gateway/test_zet_agent_title_flow.py'
      - 'tests/gateway/test_chatproto_schema_contract.py'
      - '.github/workflows/chat-ui-contract.yml'
  push:
    branches:
      - main
    paths:
      - 'gateway/platforms/zet_agent.py'
      - 'docs/zet-agent-sse-extension-contract.md'
      - 'schemas/chatproto.schema.json'
      - '.github/workflows/chat-ui-contract.yml'
  schedule:
    - cron: '29 19 * * *' # 03:29 Asia/Shanghai
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.11'
      - name: Install test deps
        # Pinned like home-guard-tests.yml (pins match pyproject [dev]):
        # pytest-timeout is mandatory because pyproject addopts sets --timeout;
        # `-e .` brings the adapter's runtime deps (aiohttp) from pyproject.
        run: |
          python -m pip install --quiet \
            pytest==9.1.1 pytest-asyncio==1.3.0 pytest-timeout==2.4.0 setuptools==83.0.0
          python -m pip install --quiet -e .
      - name: Adapter contract tests
        run: |
          python -m pytest -q -p no:cacheprovider \
            tests/gateway/test_zet_agent_extension_turn_id.py \
            tests/gateway/test_zet_agent_title_flow.py \
            tests/gateway/test_chatproto_schema_contract.py

  contract:
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HAS_PAT: ${{ secrets.ZETTLAB_PRIVATE_MODULES_PAT != '' }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        if: env.HAS_PAT == 'true'
        with:
          node-version: 22
      - name: Checkout chat-ui contract (zettlab-product-dev main)
        if: env.HAS_PAT == 'true'
        env:
          ZETTLAB_PAT: ${{ secrets.ZETTLAB_PRIVATE_MODULES_PAT }}
        run: |
          set -euo pipefail
          url="https://x-access-token:${ZETTLAB_PAT}@github.com/zettlab/zettlab-product-dev.git"
          for attempt in 1 2 3; do
            if git clone --depth 1 --branch main --filter=blob:none --sparse "$url" "$RUNNER_TEMP/product-dev"; then break; fi
            rm -rf "$RUNNER_TEMP/product-dev"; sleep $((attempt * 10))
            [ "$attempt" = 3 ] && { echo "::error::clone of zettlab-product-dev@main failed after 3 attempts"; exit 1; }
          done
          git -C "$RUNNER_TEMP/product-dev" sparse-checkout set contracts/chat-ui/v1 scripts/chat-ui-contract
      - name: Chat UI contract guard (scope hermes)
        if: env.HAS_PAT == 'true'
        env:
          CHAT_UI_CONTRACT_ROOT: ${{ runner.temp }}/product-dev
          CHAT_UI_CONTRACT_HERMES_AGENT_DIR: ${{ github.workspace }}
        run: node "$RUNNER_TEMP/product-dev/scripts/chat-ui-contract/verify.mjs" --scope hermes
      - name: Skipped (no PAT)
        if: env.HAS_PAT != 'true'
        run: |
          echo "::warning title=chat-ui contract::ZETTLAB_PRIVATE_MODULES_PAT is not configured; the --scope hermes guard did NOT run. Configure the secret (contents:read on zettlab-product-dev)."
