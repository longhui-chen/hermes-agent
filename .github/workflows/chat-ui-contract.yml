name: Chat UI Contract

# GENERATED from zettlab-product-dev ci/templates/chat-ui-contract.subrepo.yml
# (params: ci/templates/chat-ui-contract.params.json → hermes). Do not edit by
# hand: the root guard (`verify.mjs --scope hermes`) diffs this file against the
# rendered template.
#
# Two legs (chat-ui-b0-1-guard-manifests):
#   * PR time, WITHOUT any secret: this repo's committed contract manifest
#     (schemas/chat-ui.manifest.json) must be fresh and is compared against the
#     mirrored contract snapshot (schemas/chat-ui-golden.snapshot.json, sha
#     pinned in the tests). Job `manifest` below runs it on pull requests.
#   * `mirror-freshness` runs on the default branch / nightly with the cross-repo
#     PAT and only answers "is the mirror behind zettlab-product-dev main?". A
#     missing PAT is a warning, never a silent pass, and never blocks.

on:
  pull_request:
    paths:
      - 'gateway/platforms/zet_agent.py'
      - 'gateway/platforms/api_server.py'
      - 'docs/zet-agent-sse-extension-contract.md'
      - 'schemas/chatproto.schema.json'
      - 'schemas/chat-ui.manifest.json'
      - 'schemas/chat-ui-golden.snapshot.json'
      - 'tests/gateway/chat_ui_contract.py'
      - 'tests/gateway/test_zet_agent_contract_manifest.py'
      - 'tests/gateway/test_zet_agent_producer_conformance.py'
      - '.github/workflows/chat-ui-contract.yml'
      - 'agent/conversation_compression.py'
      - 'run_agent.py'
      - 'tests/gateway/test_zet_agent_title_flow.py'
      - 'scripts/test-harness/invariant-gated-packages.txt'
      - 'scripts/test-harness/invariant_gate.sh'
      - 'tests/run_agent/test_steer_u2d.py'
  push:
    branches:
      - main
    paths:
      - 'gateway/platforms/zet_agent.py'
      - 'gateway/platforms/api_server.py'
      - 'docs/zet-agent-sse-extension-contract.md'
      - 'schemas/chatproto.schema.json'
      - 'schemas/chat-ui.manifest.json'
      - 'schemas/chat-ui-golden.snapshot.json'
      - 'tests/gateway/chat_ui_contract.py'
      - 'tests/gateway/test_zet_agent_contract_manifest.py'
      - 'tests/gateway/test_zet_agent_producer_conformance.py'
      - '.github/workflows/chat-ui-contract.yml'
      - 'agent/conversation_compression.py'
      - 'run_agent.py'
      - 'tests/gateway/test_zet_agent_title_flow.py'
      - 'scripts/test-harness/invariant-gated-packages.txt'
      - 'scripts/test-harness/invariant_gate.sh'
      - 'tests/run_agent/test_steer_u2d.py'
  schedule:
    - cron: '41 19 * * *' # 03:41 Asia/Shanghai
  workflow_dispatch:

permissions:
  contents: read

jobs:
  manifest:
    if: github.repository_owner == 'zettlab'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      # `-e .` brings the adapter's runtime deps (aiohttp, pyyaml) from pyproject.
      - run: |
          python -m pip install --quiet --disable-pip-version-check pytest==9.1.1 pytest-asyncio==1.3.0 pytest-timeout==2.4.0 setuptools==83.0.0
          python -m pip install --quiet -e .
      - name: Contract manifest + producer conformance (no secret)
        run: python -m pytest -q -p no:cacheprovider tests/gateway/test_zet_agent_contract_manifest.py tests/gateway/test_zet_agent_producer_conformance.py tests/gateway/test_zet_agent_bt.py tests/gateway/test_zet_agent_extension_turn_id.py tests/gateway/test_zet_agent_title_flow.py tests/gateway/test_chatproto_schema_contract.py
      - name: HR7 invariant gate
        env:
          HERMES_PYTHON: python
        run: bash scripts/test-harness/invariant_gate.sh

  mirror-freshness:
    if: github.repository_owner == 'zettlab' && github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HAS_PAT: ${{ secrets.ZETTLAB_PRIVATE_MODULES_PAT != '' }}
    steps:
      - name: Checkout trusted hermes-agent
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Checkout chat-ui contract (zettlab-product-dev main)
        if: env.HAS_PAT == 'true'
        env:
          ZETTLAB_PAT: ${{ secrets.ZETTLAB_PRIVATE_MODULES_PAT }}
        run: |
          set -euo pipefail
          url="https://oauth2:${ZETTLAB_PAT}@github.com/zettlab/zettlab-product-dev.git"
          for attempt in 1 2 3; do
            if git clone --depth 1 --branch main --filter=blob:none --sparse "$url" "$RUNNER_TEMP/product-dev"; then break; fi
            rm -rf "$RUNNER_TEMP/product-dev"; sleep $((attempt * 10))
            [ "$attempt" = 3 ] && { echo "::error::clone of zettlab-product-dev@main failed after 3 attempts"; exit 1; }
          done
          git -C "$RUNNER_TEMP/product-dev" sparse-checkout set contracts/chat-ui/v1 scripts/chat-ui-contract ci/templates
          git -C "$RUNNER_TEMP/product-dev" remote set-url origin https://github.com/zettlab/zettlab-product-dev.git
      - name: Chat UI contract guard (scope hermes) against root main
        if: env.HAS_PAT == 'true'
        env:
          CHAT_UI_CONTRACT_ROOT: ${{ runner.temp }}/product-dev
          CHAT_UI_CONTRACT_HERMES_AGENT_DIR: ${{ github.workspace }}
        run: node "$RUNNER_TEMP/product-dev/scripts/chat-ui-contract/verify.mjs" --scope hermes
      - name: Skipped (no PAT)
        if: env.HAS_PAT != 'true'
        run: |
          echo "::warning title=chat-ui contract::ZETTLAB_PRIVATE_MODULES_PAT is not configured; the mirror-freshness check against zettlab-product-dev main did NOT run. PR-time guard (job manifest) is unaffected."
