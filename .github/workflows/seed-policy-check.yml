name: seed-policy-check

# Seed-policy + de-brand guard. config/skill_seed_policy.json is the fail-closed
# allowlist for new profiles. Public wheel/sdist distribution is unsupported;
# packaged-content coverage follows the Zettlab ZPK source-tree contract, while
# an authorized ZPK wheel build verifies the installed top-level modules.

on:
  pull_request:
    paths:
      - 'skills/**'
      - 'config/skill_seed_policy.json'
      - 'config/seed_fallback_manifest.txt'
      - 'tools/skills_sync.py'
      - 'tools/check_seed_policy.py'
      - 'tools/check_sibling_debrand.py'
      - 'config/sibling_upstream_baseline.json'
      - 'tests/tools/test_skills_sync.py'
      - 'tests/tools/test_check_sibling_debrand.py'
      - 'website/scripts/generate-skill-docs.py'
      - 'website/scripts/extract-skills.py'
      # Any Python source: a new top-level module or import can change what the
      # authorized Nix/ZPK wheel must ship.
      - '**.py'
      - 'pyproject.toml'
      - 'setup.py'
      - 'Makefile'
      - 'scripts/install.sh'
      - 'scripts/install.ps1'
      - 'setup-hermes.sh'
      - 'scripts/check_zpk_payload.py'
      - 'scripts/check_zpk_stage.py'
      - 'tests/scripts/test_zpk_stage_payload.py'
      - 'tests/test_packaging_build_guard.py'
      - '.github/workflows/seed-policy-check.yml'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.11'
      - name: Install exact test dependencies
        run: python -m pip install --quiet pyyaml==6.0.3 pytest==9.1.1 setuptools==83.0.0
      - name: Validate seed policy (fail-closed)
        run: python tools/check_seed_policy.py
      - name: De-branded sibling stays brand-clean and in sync
        run: python tools/check_sibling_debrand.py
      - name: Seed sync and ZPK packaging contracts
        run: |
          HERMES_PYTHON="$(command -v python)" scripts/run_tests.sh \
            tests/tools/test_skills_sync.py \
            tests/tools/test_check_sibling_debrand.py \
            tests/scripts/test_zpk_stage_payload.py \
            tests/test_packaging_build_guard.py \
            tests/test_packaging_metadata.py
      - name: Authorized ZPK wheel ships declared top-level modules
        run: |
          python -m pip install --quiet build==1.5.0
          HERMES_ZPK_BUILD=1 python -m build --wheel --outdir /tmp/wheelcheck >/dev/null
          python - <<'PY'
          import glob
          import tomllib
          import zipfile

          whl = glob.glob("/tmp/wheelcheck/*.whl")[0]
          names = zipfile.ZipFile(whl).namelist()
          with open("pyproject.toml", "rb") as fh:
              declared = tomllib.load(fh)["tool"]["setuptools"]["py-modules"]
          top_level = {n for n in names if n.endswith(".py") and "/" not in n}
          absent = sorted(f"{m}.py" for m in declared if f"{m}.py" not in top_level)
          assert not absent, f"wheel is missing declared py-modules: {absent}"
          print(f"wheel payload OK ({len(declared)} declared py-modules present)")
          PY
      - name: Skills Hub stays curated
        run: |
          python - <<'PY'
          import importlib.util
          import json

          spec = importlib.util.spec_from_file_location("extract_skills", "website/scripts/extract-skills.py")
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          with open("config/skill_seed_policy.json", encoding="utf-8") as handle:
              policy = json.load(handle)
          expected = len(policy["seed"])
          builtin = [skill for skill in module.extract_local_skills() if skill["source"] == "built-in"]
          names = sorted(skill["name"] for skill in builtin)
          assert len(builtin) == expected, f"Hub built-in {len(builtin)} != seed {expected}: {names}"
          assert names == sorted(policy["seed"]), f"Hub names != policy seed: {names}"
          print(f"Skills Hub OK: {len(builtin)} curated built-in skills")
          PY
