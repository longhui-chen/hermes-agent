name: seed-policy-check

# Seed-policy + de-brand guard. config/skill_seed_policy.json is a pure allowlist
# deciding what a new profile seeds. This workflow keeps the policy consistent
# with the bundled skill tree and exercises the seed-time sync logic; it also
# (de-brand follow-up) guards the de-branded sibling zettlab-memo-setup, which
# must stay brand-clean and structurally in sync with upstream hermes-agent
# (tools/check_sibling_debrand.py).

on:
  pull_request:
    paths:
      - 'skills/**'
      - 'config/skill_seed_policy.json'
      - 'config/seed_fallback_manifest.txt'
      - 'tools/skills_sync.py'
      - 'tools/check_seed_policy.py'
      - 'tools/check_sibling_debrand.py'
      - 'config/sibling_upstream_baseline.json'
      - 'tests/tools/test_skills_sync.py'
      - 'tests/tools/test_check_sibling_debrand.py'
      - 'website/scripts/generate-skill-docs.py'
      - 'website/scripts/extract-skills.py'
      # Any Python source: a new top-level module or import can change what the
      # wheel must ship, and the packaging declarations below do not name it.
      - '**.py'
      # Packaging / install chain — these decide whether the wheel/sdist/ZPK
      # actually ship the policy + skill trees, so a change here can break
      # seeding without touching the policy itself.
      - 'pyproject.toml'
      - 'setup.py'
      - 'MANIFEST.in'
      - 'scripts/install.sh'
      - 'scripts/install.ps1'
      - 'setup-hermes.sh'
      - 'scripts/check_zpk_payload.py'
      - 'tests/test_packaging_data_files.py'
      - 'tests/test_packaging_metadata.py'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.11'
      - name: Validate seed policy (fail-closed)
        run: python tools/check_seed_policy.py
      - name: De-branded sibling stays brand-clean + in sync with upstream hermes-agent
        run: python tools/check_sibling_debrand.py
      - name: Seed/sync + packaging unit tests
        run: |
          # pytest-timeout is required: the repo's pyproject addopts sets
          # --timeout/--timeout-method, and pytest exits 4 (usage error) without it.
          python -m pip install --quiet pyyaml==6.0.3 pytest==9.0.2 pytest-timeout==2.4.0 setuptools==82.0.1
          python -m pytest tests/tools/test_skills_sync.py tests/tools/test_check_sibling_debrand.py tests/test_packaging_data_files.py tests/test_packaging_metadata.py -q
      - name: Wheel ships the seed policy + skill trees
        run: |
          python -m pip install --quiet build==1.5.0
          python -m build --wheel --outdir /tmp/wheelcheck >/dev/null
          python - <<'PY'
          import zipfile, glob, sys
          whl = glob.glob("/tmp/wheelcheck/*.whl")[0]
          names = zipfile.ZipFile(whl).namelist()
          def has(p): return sum(1 for n in names if p in n)
          checks = {
              "skills/": has("/data/skills/"),
              "config/skill_seed_policy.json": has("config/skill_seed_policy.json"),
              "config/seed_fallback_manifest.txt": has("config/seed_fallback_manifest.txt"),
              "locales/": has("/data/locales/"),
          }
          print(checks)
          missing = [k for k, v in checks.items() if not v]
          assert not missing, f"wheel is missing required payload: {missing}"
          print("wheel payload OK")
          PY
      - name: Installed wheel seeds the curated set (real sysconfig resolution)
        run: |
          # Path presence isn't enough — install the wheel and prove the runtime
          # resolves the bundled skills/ + config/ policy via sysconfig and seeds
          # the curated set, catching future install-layout / data-scheme regressions.
          # The venv is deliberately named `venv`: the wheel's skills land at
          # <venv>/skills/..., and the skill-path exclusion set contains `venv`,
          # so a regression that checks exclusion against the absolute install path
          # would drop every bundled skill (seed 0). A non-`venv` name would hide it.
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install --quiet --no-deps /tmp/wheelcheck/*.whl
          cd /tmp  # import the INSTALLED package, not the source checkout
          HERMES_HOME=/tmp/wseed /tmp/venv/bin/python - <<'PY'
          from tools import skills_sync as s
          pol = s._read_seed_policy()
          assert pol is not None, "installed wheel: seed policy not resolved via sysconfig"
          assert s._get_bundled_dir().exists(), "installed wheel: bundled skills not resolved"
          r = s.sync_skills(quiet=True)
          want, got = len(pol["seed_set"]), len(r["copied"])
          assert got == want, f"installed wheel seeded {got} != policy {want}"
          print(f"installed wheel seeds {got} curated skills via sysconfig data dir")
          PY
      - name: Skills Hub stays curated (extract-skills policy filter)
        run: |
          python - <<'PY'
          import json, importlib.util, sys
          spec = importlib.util.spec_from_file_location("ex", "website/scripts/extract-skills.py")
          m = importlib.util.module_from_spec(spec); spec.loader.exec_module(m)
          pol = json.load(open("config/skill_seed_policy.json"))
          want = len(pol["seed"])
          builtin = [s for s in m.extract_local_skills() if s["source"] == "built-in"]
          names = sorted(s["name"] for s in builtin)
          assert len(builtin) == want, f"Hub built-in {len(builtin)} != seed {want}: {names}"
          # NOTE: brand-cleanliness of the seeded names is NOT asserted here. This PR
          # seeds the upstream names verbatim (incl. claude-design, baoyu-infographic);
          # de-branding is a separate follow-up that will add the brand check then.
          assert sorted(names) == sorted(pol["seed"]), f"Hub names != policy seed: {names}"
          print(f"Skills Hub OK: {len(builtin)} curated built-in skills (names == policy seed).")
          PY
