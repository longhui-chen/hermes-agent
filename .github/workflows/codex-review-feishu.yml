name: Codex Review -> Feishu Capture
run-name: codex-feishu-capture:${{ github.event_name == 'pull_request_review' && 'review' || 'check' }}:${{ github.event.pull_request.number || 0 }}:${{ github.event.review.id || github.event.check_run.id }}

# Untrusted source events only create a read-only workflow_run wake-up. This workflow has no
# checkout, artifact, repository write, environment, or secret boundary to cross.
on:
  pull_request_review:
    types: [submitted]
  check_run:
    types: [completed]

permissions: {}

jobs:
  capture:
    if: >-
      github.repository_owner == 'zettlab' &&
      (
        (github.event_name == 'pull_request_review' &&
          github.event.review.user.id == 199175422 &&
          github.event.review.user.login == 'chatgpt-codex-connector[bot]') ||
        (github.event_name == 'check_run' &&
          github.event.check_run.app.slug == 'chatgpt-codex-connector')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 1
    permissions: {}
    steps:
      - name: Emit read-only workflow_run wake-up
        run: ':'
