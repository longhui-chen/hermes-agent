name: Codex Review -> Feishu

# Untrusted event payloads never enter a secret-bearing job. They only append an immutable
# event ref, then request a fresh default-branch repository_dispatch consumer. PR comments are
# the durable queue because GitHub concurrency retains only one pending job per group.
on:
  pull_request_review:
    types: [submitted]
  check_run:
    types: [completed]
  repository_dispatch:
    types: [codex-review-feishu-drain]
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
    inputs:
      pr_number:
        description: Open PR number whose thread or delivery state should be repaired
        required: true
        type: string
      event_key:
        description: Delivery eventKey for history_multiple repair; empty means thread repair
        required: false
        type: string
      repair_action:
        description: Signed delivery action; only used when event_key is set
        required: true
        default: select_mid
        type: choice
        options:
          - select_mid
          - retry
          - discard
      message_id:
        description: Canonical Feishu message_id (empty only for explicit pending release)
        required: false
        type: string
      release:
        description: Explicitly release a pending thread generation
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  resolve_pr:
    if: >-
      github.repository_owner == 'zettlab' &&
      (
        (github.event_name == 'repository_dispatch' && github.event.action == 'codex-review-feishu-drain') ||
        (github.event_name == 'pull_request_review' &&
          github.event.review.user.id == 199175422 &&
          github.event.review.user.login == 'chatgpt-codex-connector[bot]') ||
        (github.event_name == 'check_run' &&
          github.event.check_run.app.slug == 'chatgpt-codex-connector')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      checks: read
    outputs:
      pr_number: ${{ steps.resolve.outputs.pr_number }}
    steps:
      - name: Checkout trusted PR resolver
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: scripts/codereview
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Resolve one PR without notification secrets
        id: resolve
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const { resolvePrNumber } = require(`${process.env.GITHUB_WORKSPACE}/scripts/codereview/notify.js`);
            const prNumber = await resolvePrNumber(github, context, core);
            if (!prNumber) return;
            core.setOutput('pr_number', String(prNumber));

  enqueue:
    needs: resolve_pr
    if: >-
      needs.resolve_pr.result == 'success' &&
      needs.resolve_pr.outputs.pr_number != '' &&
      (github.event_name == 'pull_request_review' || github.event_name == 'check_run')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
      issues: write
      checks: read
    steps:
      - name: Checkout trusted queue writer
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: scripts/codereview
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Persist immutable Codex event before concurrency
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          RESOLVED_PR_NUMBER: ${{ needs.resolve_pr.outputs.pr_number }}
        with:
          script: |
            const { enqueueOfficialCodexEvent } = require(`${process.env.GITHUB_WORKSPACE}/scripts/codereview/notify.js`);
            await enqueueOfficialCodexEvent({ github, context, core });

  kick_consumer:
    needs: [resolve_pr, enqueue]
    if: >-
      always() &&
      needs.resolve_pr.result == 'success' &&
      needs.resolve_pr.outputs.pr_number != '' &&
      (github.event_name == 'pull_request_review' || github.event_name == 'check_run')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout trusted scheduler
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: scripts/codereview
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Kick default-branch queue consumer even when enqueue failed
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          RESOLVED_PR_NUMBER: ${{ needs.resolve_pr.outputs.pr_number }}
        with:
          script: |
            const { scheduleQueuedCodexDrain } = require(`${process.env.GITHUB_WORKSPACE}/scripts/codereview/notify.js`);
            await scheduleQueuedCodexDrain({ github, context, core });

  report:
    needs: resolve_pr
    if: >-
      needs.resolve_pr.result == 'success' &&
      needs.resolve_pr.outputs.pr_number != '' &&
      github.event_name == 'repository_dispatch' &&
      github.ref_name == github.event.repository.default_branch
    concurrency:
      group: codex-review-feishu-${{ github.repository }}-pr-${{ needs.resolve_pr.outputs.pr_number }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: codex-review-feishu-production
    permissions:
      contents: read
      pull-requests: write
      issues: write
      checks: read
    outputs:
      needs_dispatch: ${{ steps.continuation.outputs.needs_dispatch }}
      continuation_mode: ${{ steps.continuation.outputs.continuation_mode }}
    steps:
      - name: Checkout trusted notification scripts
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: |
            scripts/codereview
            .github/workflows/codex-review-feishu.yml
            scripts/test-harness/feishu/feishu_openid_registry.json
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Verify notification thread flow
        run: node scripts/codereview/test_notify_flow.js

      - name: Drain durable Codex event queue
        id: drain_first
        continue-on-error: true
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          RESOLVED_PR_NUMBER: ${{ needs.resolve_pr.outputs.pr_number }}
          CODEREVIEW_FEISHU_APP_ID: ${{ secrets.CODEREVIEW_FEISHU_APP_ID }}
          CODEREVIEW_FEISHU_APP_SECRET: ${{ secrets.CODEREVIEW_FEISHU_APP_SECRET }}
          CODEREVIEW_FEISHU_CHAT_ID: ${{ secrets.CODEREVIEW_FEISHU_CHAT_ID }}
          CODEX_FEISHU_REPAIR_PUBLIC_KEYS: ${{ vars.CODEX_FEISHU_REPAIR_PUBLIC_KEYS }}
          CODEREVIEW_NOTIFY_ON: important
        with:
          script: |
            const { drainQueuedCodexEvents } = require(`${process.env.GITHUB_WORKSPACE}/scripts/codereview/notify.js`);
            await drainQueuedCodexEvents({ github, context, core });

      - name: Delay before history reconciliation
        if: steps.drain_first.outcome == 'failure'
        run: sleep 30

      - name: Reconcile delivery after delay
        id: drain_retry
        if: steps.drain_first.outcome == 'failure'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          RESOLVED_PR_NUMBER: ${{ needs.resolve_pr.outputs.pr_number }}
          CODEREVIEW_FEISHU_APP_ID: ${{ secrets.CODEREVIEW_FEISHU_APP_ID }}
          CODEREVIEW_FEISHU_APP_SECRET: ${{ secrets.CODEREVIEW_FEISHU_APP_SECRET }}
          CODEREVIEW_FEISHU_CHAT_ID: ${{ secrets.CODEREVIEW_FEISHU_CHAT_ID }}
          CODEX_FEISHU_REPAIR_PUBLIC_KEYS: ${{ vars.CODEX_FEISHU_REPAIR_PUBLIC_KEYS }}
          CODEREVIEW_NOTIFY_ON: important
        with:
          script: |
            const { drainQueuedCodexEvents } = require(`${process.env.GITHUB_WORKSPACE}/scripts/codereview/notify.js`);
            await drainQueuedCodexEvents({ github, context, core });

      - name: Select continuation requested by the final drain attempt
        id: continuation
        if: always()
        env:
          FIRST_OUTCOME: ${{ steps.drain_first.outcome }}
          FIRST_NEEDS_DISPATCH: ${{ steps.drain_first.outputs.needs_dispatch }}
          FIRST_MODE: ${{ steps.drain_first.outputs.continuation_mode }}
          RETRY_NEEDS_DISPATCH: ${{ steps.drain_retry.outputs.needs_dispatch }}
          RETRY_MODE: ${{ steps.drain_retry.outputs.continuation_mode }}
        run: |
          if [ "$FIRST_OUTCOME" = "failure" ]; then
            echo "needs_dispatch=${RETRY_NEEDS_DISPATCH:-false}" >> "$GITHUB_OUTPUT"
            echo "continuation_mode=${RETRY_MODE:-none}" >> "$GITHUB_OUTPUT"
          else
            echo "needs_dispatch=${FIRST_NEEDS_DISPATCH:-false}" >> "$GITHUB_OUTPUT"
            echo "continuation_mode=${FIRST_MODE:-none}" >> "$GITHUB_OUTPUT"
          fi

  schedule_continuation:
    needs: [resolve_pr, report]
    if: >-
      always() &&
      needs.resolve_pr.result == 'success' &&
      needs.resolve_pr.outputs.pr_number != '' &&
      needs.report.outputs.needs_dispatch == 'true' &&
      needs.report.outputs.continuation_mode == 'backlog'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout trusted scheduler with a fresh budget
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: scripts/codereview
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Schedule next queue consumer
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          RESOLVED_PR_NUMBER: ${{ needs.resolve_pr.outputs.pr_number }}
        with:
          script: |
            const { scheduleQueuedCodexDrain } = require(`${process.env.GITHUB_WORKSPACE}/scripts/codereview/notify.js`);
            await scheduleQueuedCodexDrain({ github, context, core });

  queue_watchdog:
    if: >-
      github.event_name == 'schedule' &&
      github.repository_owner == 'zettlab' &&
      github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: read
      issues: read
    steps:
      - name: Checkout trusted queue watchdog
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: scripts/codereview
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Re-kick every open PR with unfinished durable events
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const { sweepQueuedCodexReviews } = require(`${process.env.GITHUB_WORKSPACE}/scripts/codereview/notify.js`);
            await sweepQueuedCodexReviews({ github, context, core });

  normalize_repair:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository_owner == 'zettlab' &&
      github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 1
    permissions:
      contents: read
    outputs:
      pr_number: ${{ steps.normalize.outputs.pr_number }}
      event_key: ${{ steps.normalize.outputs.event_key }}
      repair_action: ${{ steps.normalize.outputs.repair_action }}
    steps:
      - name: Normalize repair inputs without secrets
        id: normalize
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          RAW_PR_NUMBER: ${{ inputs.pr_number }}
          RAW_EVENT_KEY: ${{ inputs.event_key }}
          RAW_REPAIR_ACTION: ${{ inputs.repair_action }}
        with:
          script: |
            const raw = String(process.env.RAW_PR_NUMBER || '');
            if (!/^[1-9][0-9]*$/.test(raw)) return core.setFailed('pr_number 必须是 canonical 正整数');
            const prNumber = Number(raw);
            if (!Number.isSafeInteger(prNumber)) return core.setFailed('pr_number 超出 JavaScript safe integer 范围');
            const eventKey = String(process.env.RAW_EVENT_KEY || '').trim();
            if (eventKey && !/^[a-f0-9]{64}$/.test(eventKey)) return core.setFailed('event_key 格式非法');
            const repairAction = String(process.env.RAW_REPAIR_ACTION || 'select_mid');
            if (!['select_mid', 'retry', 'discard'].includes(repairAction)) return core.setFailed('repair_action 非法');
            core.setOutput('pr_number', String(prNumber));
            core.setOutput('event_key', eventKey);
            core.setOutput('repair_action', repairAction);

  repair_pending:
    needs: normalize_repair
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref_name == github.event.repository.default_branch &&
      needs.normalize_repair.result == 'success' &&
      needs.normalize_repair.outputs.pr_number != ''
    concurrency:
      group: codex-review-feishu-${{ github.repository }}-pr-${{ needs.normalize_repair.outputs.pr_number }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: codex-review-feishu-repair
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Require repository admin before exposing repair secrets
        id: admin_gate
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const actor = String(context.actor || '');
            const result = await github.rest.repos.getCollaboratorPermissionLevel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              username: actor,
            });
            const permission = String(result.data && result.data.permission || 'none');
            if (permission !== 'admin') {
              return core.setFailed(`repair 仅允许 repository admin；actor=${actor} permission=${permission}`);
            }
            core.setOutput('actor', actor);

      - name: Checkout trusted repair implementation
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: scripts/codereview
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Repair one explicitly identified durable state
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          REPAIR_PR_NUMBER: ${{ needs.normalize_repair.outputs.pr_number }}
          REPAIR_EVENT_KEY: ${{ needs.normalize_repair.outputs.event_key }}
          REPAIR_ACTION: ${{ needs.normalize_repair.outputs.repair_action }}
          REPAIR_MESSAGE_ID: ${{ inputs.message_id }}
          REPAIR_RELEASE: ${{ inputs.release }}
          REPAIR_RUN_ID: ${{ github.run_id }}
          REPAIR_ACTOR: ${{ steps.admin_gate.outputs.actor }}
          CODEX_FEISHU_REPAIR_PRIVATE_KEY: ${{ secrets.CODEX_FEISHU_REPAIR_PRIVATE_KEY }}
          CODEX_FEISHU_REPAIR_PUBLIC_KEYS: ${{ vars.CODEX_FEISHU_REPAIR_PUBLIC_KEYS }}
          CODEX_FEISHU_REPAIR_KEY_ID: ${{ vars.CODEX_FEISHU_REPAIR_KEY_ID }}
        with:
          script: |
            const crypto = require('crypto');
            const {
              finalizeThreadGeneration,
              readThreadState,
              releaseThreadGeneration,
              repairDelivery,
              repairLegacyConflict,
              repairOrphanThread,
              resolvePr,
              validFeishuMessageId,
              withGithubAttemptBudget,
            } = require(`${process.env.GITHUB_WORKSPACE}/scripts/codereview/notify.js`);
            await withGithubAttemptBudget(async () => {
              const prNumber = Number(process.env.REPAIR_PR_NUMBER);
              const eventKey = String(process.env.REPAIR_EVENT_KEY || '');
              const repairAction = String(process.env.REPAIR_ACTION || 'select_mid');
              const messageId = String(process.env.REPAIR_MESSAGE_ID || '').trim();
              const release = String(process.env.REPAIR_RELEASE) === 'true';
              const actor = String(process.env.REPAIR_ACTOR || '');
              const baseRunId = String(process.env.REPAIR_RUN_ID || '');
              if (!Number.isInteger(prNumber) || prNumber <= 0) return core.setFailed('pr_number 必须是正整数');
              if (messageId && !validFeishuMessageId(messageId)) return core.setFailed('message_id 格式非法');
              if (!actor || !baseRunId) return core.setFailed('repair admin actor/run audit binding 缺失');
              const repairAuditBinding = crypto.createHash('sha256').update(JSON.stringify({
                actor,
                repository: `${context.repo.owner}/${context.repo.repo}`,
                runId: baseRunId,
                prNumber,
                eventKey,
                repairAction,
                messageId,
                release,
              })).digest('hex').slice(0, 32);
              const auditRunId = `${baseRunId}-${repairAuditBinding}`;
              const prData = await resolvePr(github, context, { number: prNumber }, core);
              if (!prData || prData.state !== 'open') return core.setFailed('仅允许修复 OPEN PR');
              if (eventKey) {
                if (release) return core.setFailed('delivery repair 不能使用 thread release');
                if (repairAction === 'select_mid' ? !messageId : Boolean(messageId)) {
                  return core.setFailed('select_mid 必须提供 message_id；retry/discard 必须留空');
                }
                const repaired = await repairDelivery({
                  github, context, core, prNum: prNumber, eventKey, messageId,
                  action: repairAction,
                  runId: auditRunId, operator: actor,
                  privateKey: process.env.CODEX_FEISHU_REPAIR_PRIVATE_KEY,
                  keyring: process.env.CODEX_FEISHU_REPAIR_PUBLIC_KEYS,
                  keyId: process.env.CODEX_FEISHU_REPAIR_KEY_ID,
                });
                if (!repaired.ok) core.setFailed('delivery repair 未确认');
                return;
              }
              if (release === Boolean(messageId)) return core.setFailed('message_id 与 explicit release 必须且只能选择一个');
              const current = await readThreadState({ github, context, core, prNum: prNumber, allowLegacyConflict: true });
              if (current.kind === 'legacy-conflict') {
                if (release || !messageId) return core.setFailed('legacy conflict 只能用 canonical message_id 签名修复');
                const repaired = await repairLegacyConflict({
                  github, context, core, prNum: prNumber, messageId,
                  runId: auditRunId,
                  privateKey: process.env.CODEX_FEISHU_REPAIR_PRIVATE_KEY,
                  keyring: process.env.CODEX_FEISHU_REPAIR_PUBLIC_KEYS,
                  keyId: process.env.CODEX_FEISHU_REPAIR_KEY_ID,
                });
                if (!repaired.ok) core.setFailed('legacy conflict 签名修复未确认');
                return;
              }
              if (!current.ok || current.kind !== 'pending') return core.setFailed('最高 generation 不是 pending 或 legacy conflict，拒绝修复');
              const result = await repairOrphanThread({
                github, context, core, prNum: prNumber, current, messageId, release,
                runId: auditRunId, operator: actor,
                privateKey: process.env.CODEX_FEISHU_REPAIR_PRIVATE_KEY,
                keyring: process.env.CODEX_FEISHU_REPAIR_PUBLIC_KEYS,
                keyId: process.env.CODEX_FEISHU_REPAIR_KEY_ID,
              });
              if (!result.ok) core.setFailed('orphan pending thread 签名修复未确认');
            });

  kick_after_repair:
    needs: [normalize_repair, repair_pending]
    if: >-
      always() &&
      needs.normalize_repair.result == 'success' &&
      needs.normalize_repair.outputs.pr_number != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout trusted post-repair scheduler
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: scripts/codereview
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Kick a fresh default-branch consumer after repair
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          RESOLVED_PR_NUMBER: ${{ needs.normalize_repair.outputs.pr_number }}
        with:
          script: |
            const { scheduleQueuedCodexDrain } = require(`${process.env.GITHUB_WORKSPACE}/scripts/codereview/notify.js`);
            await scheduleQueuedCodexDrain({ github, context, core });
