name: Zettlab Overlay Gate Selftest

# Informational only: runs the PR's own copy of the overlay-gate tests so a PR that
# edits the gate sees its test results. The job name is deliberately different from
# `overlay-gate` (the required check produced by zettlab-overlay-gate.yml on
# pull_request_target) so it can never satisfy branch protection in its place.

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "scripts/test-harness/overlay_gate.py"
      - "scripts/test-harness/overlay_gate.json"
      - "tests/ci/test_overlay_gate.py"
      - ".github/workflows/zettlab-overlay-gate.yml"
      - ".github/workflows/zettlab-overlay-gate-selftest.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  overlay-gate-selftest:
    if: github.repository_owner == 'zettlab'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Gate self-test (PR copy, informational)
        run: |
          python -m pip install --quiet --disable-pip-version-check pytest==9.1.1
          python -m pytest -q -p no:cacheprovider tests/ci/test_overlay_gate.py
